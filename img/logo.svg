<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Pixel Warriors: a pixel-art knight helmet with a gold plume -->
  <rect width="16" height="16" rx="3" fill="#2b1c6e"/>
  <g fill="#1b1530">
    <rect x="4" y="3" width="8" height="1"/>
    <rect x="3" y="4" width="1" height="8"/>
    <rect x="12" y="4" width="1" height="8"/>
    <rect x="4" y="12" width="8" height="1"/>
  </g>
  <rect x="4" y="4" width="8" height="8" fill="#c9d4e6"/>
  <rect x="4" y="4" width="8" height="2" fill="#e8eef8"/>
  <rect x="5" y="7" width="6" height="1" fill="#1b1530"/>
  <rect x="7" y="8" width="2" height="3" fill="#1b1530"/>
  <rect x="4" y="10" width="2" height="2" fill="#9aa6bd"/>
  <rect x="10" y="10" width="2" height="2" fill="#9aa6bd"/>
  <g fill="#ffd54a">
    <rect x="7" y="1" width="2" height="2"/>
    <rect x="9" y="1" width="2" height="1"/>
    <rect x="11" y="2" width="1" height="1"/>
  </g>
  <rect x="7" y="2" width="1" height="1" fill="#ff8a3d"/>
</svg>
